name: shell commands

on: 
  - push

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
jobs:
  terraform-workflow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout # checking out our code from the github repository to the virtual machine
        uses: actions/checkout@v1
      - name: Set Terraform # after checking out our code we can set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.1.9
      - name: Terraform Init # after setting up Terraform we can initialize it
        run: terraform init
      - name: Terraform validate
        run: terraform validate
      - name: Terraform plan
        run: terraform plan
      - name: Terraform apply
        run: terraform apply
      - name: Terraform destroy
        run: terraform destroy
     